name: MSVC-CI

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'matiiss/pycdc'
          ref: 'fix-3.13-calls'

      - name: Build
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pycdc-windows
          path: build/Release/*.exe
